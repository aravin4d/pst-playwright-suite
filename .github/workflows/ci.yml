name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_browsers:
        description: Also run Firefox and WebKit
        type: boolean
        default: false
  schedule:
    - cron: '30 1 * * 1-5' # weekdays 07:00 IST, full browser matrix

concurrency:
  # Per trigger, so a manual or scheduled run never cancels the run for a push.
  group: playwright-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Pick projects
        id: projects
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.all_browsers }}" = "true" ]; then
            echo "browsers=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "browsers=chromium" >> "$GITHUB_OUTPUT"
            echo "args=--project=api --project=chromium --project=mobile" >> "$GITHUB_OUTPUT"
          fi

      - name: Install browsers
        run: npx playwright install --with-deps ${{ steps.projects.outputs.browsers }}

      - name: Run tests
        run: npx playwright test ${{ steps.projects.outputs.args }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
